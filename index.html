<!doctype html>
<html lang="en" data-theme="dark">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/chamfer.png" />
  <meta name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Maël Rabot · Software engineer</title>
  <meta name="description" content="Maël Rabot, software engineer in Paris. Pedagogical mentor at Epitech and co-founder of Lucy-Robotics, building Lucy, an open-source framework that makes robots simpler to use." />
  <meta name="theme-color" content="#0E0E0F" />
  <!-- Apply the saved theme before the app loads (no flash). Dark is the default.
       Colours mirror palettes.*.bg in src/theme/theme.const.ts; ThemeProvider takes over after mount. -->
  <script>
    (function () {
      var mode = 'dark';
      try { if (localStorage.getItem('theme') === 'light') mode = 'light'; } catch (e) {}
      var bg = mode === 'light' ? '#F7F1E5' : '#0E0E0F';
      document.documentElement.dataset.theme = mode;
      document.documentElement.style.backgroundColor = bg;
      document.querySelector('meta[name="theme-color"]').setAttribute('content', bg);
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap"
    rel="stylesheet">
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
